name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload; no stored token needed
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Lint
        # Build with the project's Go toolchain; the v1 release binary was
        # built with Go 1.24 and cannot analyze this module's Go 1.25 target.
        run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run

      - name: Vet
        run: go vet ./...

      # Runs the unit suite AND the static egress guard
      # (internal/httpx/guard_test.go), which fails the build if any package
      # outside internal/httpx constructs a raw http.Client / http.NewRequest —
      # so un-receipted egress can't merge.
      - name: Test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: false
